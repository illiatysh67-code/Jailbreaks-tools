
name: Build Dopamine IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project DopamineWeb.xcodeproj \
            -scheme DopamineWeb \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Dopamine.app Payload/
          zip -r Dopamine.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-IPA
          path: Dopamine.ipa
