name: DopamineWeb

options:
  bundleIdPrefix: com.solartech

targets:
  DopamineWeb:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: Sources

    resources:
      - path: index.html

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solartech.dopamine
        PRODUCT_NAME: Dopamine
        INFOPLIST_KEY_CFBundleDisplayName: Dopamine
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
